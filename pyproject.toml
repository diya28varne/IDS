[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.1.0"
description = "Evidence-driven hybrid ML intrusion detection research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
